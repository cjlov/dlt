<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大乐透模拟摇奖｜娱乐版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{background:#111;color:#fff;padding:20px}
.box{max-width:820px;margin:0 auto}
.ballWrap{display:flex;gap:12px;align-items:center;margin:24px 0;min-height:80px}
.ball{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:18px}
.front{background:#e63946}
.back{background:#457b9d}
button{padding:12px 26px;font-size:16px;border:none;border-radius:8px;background:#2a9d8f;color:#fff;cursor:pointer;margin-right:10px}
#stat{margin-top:24px;padding:16px;border:1px solid #444;border-radius:10px;font-size:12px;line-height:1.7}
.info{margin:12px 0;color:#aaa;font-size:14px}
.prize{margin-top:16px;padding:12px;border:1px solid #333;border-radius:8px;color:#ffd166}
</style>
</head>
<body>
<div class="box">
  <h2>大乐透模拟摇奖（娱乐专用）</h2>
  <div class="info">⚠️ 模拟器，和真实开奖无任何关联，无法预测开奖结果</div>
  <button onclick="startRoll()">开始摇奖</button>
  <button onclick="resetStat()">清空统计</button>
  <div class="ballWrap" id="ballBox"></div>
  <div id="resultText"></div>
  <div class="prize" id="prizeText"></div>
  <div id="stat">
    <div>前区频次统计：</div>
    <div id="frontStat"></div>
  </div>
</div>

<script>
// 频次记录
let frontCount = Array(36).fill(0);

// 密码学安全随机
function secureRandom(min, max) {
  const u32 = new Uint32Array(1);
  window.crypto.getRandomValues(u32);
  const r = u32[0] / (0xFFFFFFFF + 1);
  return Math.floor(r * (max - min + 1)) + min;
}

// 获取原始乱序号码（不排序）
function getFrontRaw(){
  let arr = [];
  while(arr.length <5){
    let n = secureRandom(1,35);
    if(!arr.includes(n)) arr.push(n);
  }
  return arr;
}
function getBackRaw(){
  let arr = [];
  while(arr.length <2){
    let n = secureRandom(1,12);
    if(!arr.includes(n)) arr.push(n);
  }
  return arr;
}
function sortArr(a){
  return [...a].sort((x,y)=>x-y);
}

// 更新统计面板
function updateStat(arr){
  arr.forEach(v=>frontCount[v]++);
  let s = "";
  for(let i=1;i<=35;i++){
    s += i+":"+frontCount[i]+"  ";
  }
  document.getElementById("frontStat").innerText = s;
}
function resetStat(){
  frontCount = Array(36).fill(0);
  document.getElementById("frontStat").innerText = "";
  document.getElementById("ballBox").innerHTML = "";
  document.getElementById("resultText").innerText = "";
  document.getElementById("prizeText").innerText = "";
}

// 奖级判定（官方9档）
function checkPrize(winFront, winBack, userFront, userBack){
  const matchFront = winFront.filter(x=>userFront.includes(x)).length;
  const matchBack = winBack.filter(x=>userBack.includes(x)).length;
  if(matchFront===5 && matchBack===2) return "一等奖（浮动奖）";
  if(matchFront===5 && matchBack===1) return "二等奖（浮动奖）";
  if(matchFront===5 && matchBack===0) return "三等奖（浮动奖）";
  if(matchFront===4 && matchBack===2) return "四等奖 3000元";
  if(matchFront===4 && matchBack===1) return "五等奖 200元";
  if(matchFront===3 && matchBack===2) return "六等奖 100元";
  if(matchFront===4 && matchBack===0) return "七等奖 10元";
  if((matchFront===3 && matchBack===1) || (matchFront===2 && matchBack===2)) return "八等奖 5元";
  if((matchFront===3 && matchBack===0) || (matchFront===2 && matchBack===1) || (matchFront===1 && matchBack===2)) return "九等奖 2元";
  return "未中奖";
}

// 摇奖动画
async function startRoll(){
  const box = document.getElementById("ballBox");
  box.innerHTML = "";
  document.getElementById("resultText").innerText = "";
  document.getElementById("prizeText").innerText = "";

  // 拿到乱序原始开奖号码
  const rawFront = getFrontRaw();
  const rawBack = getBackRaw();

  // 小球逐个乱序落下
  for(let num of rawFront){
    const b = document.createElement("div");
    b.className = "ball front";
    b.innerText = num.toString().padStart(2,"0");
    box.appendChild(b);
    await sleep(220);
  }
  for(let num of rawBack){
    const b = document.createElement("div");
    b.className = "ball back";
    b.innerText = num.toString().padStart(2,"0");
    box.appendChild(b);
    await sleep(220);
  }

  // 全部落完，再排序展示最终开奖号
  const sortedFront = sortArr(rawFront);
  const sortedBack = sortArr(rawBack);
  box.innerHTML = "";
  for(let n of sortedFront){
    const b = document.createElement("div");
    b.className = "ball front";
    b.innerText = n.toString().padStart(2,"0");
    box.appendChild(b);
  }
  for(let n of sortedBack){
    const b = document.createElement("div");
    b.className = "ball back";
    b.innerText = n.toString().padStart(2,"0");
    box.appendChild(b);
  }

  updateStat(sortedFront);
  document.getElementById("resultText").innerText = `开奖号码：前区 ${sortedFront.join(" ")}｜后区 ${sortedBack.join(" ")}`;
  // 这里可以改成你自己输入的号码，我先用开奖号自测演示
  const prizeResult = checkPrize(sortedFront, sortedBack, sortedFront, sortedBack);
  document.getElementById("prizeText").innerText = `模拟中奖判定：${prizeResult}`;
}
function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}
</script>
</body>
</html>
