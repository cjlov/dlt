<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超级大乐透-修复版模拟摇奖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px 40px;
            background:
                radial-gradient(circle at 20% 10%, rgba(255, 215, 0, 0.18), transparent 26%),
                radial-gradient(circle at 80% 20%, rgba(255, 90, 90, 0.16), transparent 28%),
                radial-gradient(circle at 50% 90%, rgba(0, 120, 255, 0.18), transparent 36%),
                linear-gradient(180deg, #05070d 0%, #0c1222 45%, #080c18 100%);
            color: #fff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.04) 0px,
                    rgba(255, 255, 255, 0.04) 1px,
                    transparent 1px,
                    transparent 3px
                );
            pointer-events: none;
            z-index: 0;
        }

        .top-tags {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            z-index: 2;
        }

        .tag {
            flex: 1;
            text-align: center;
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 13px;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.35);
            color: #ffd86b;
        }

        .machine-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 24px;
            z-index: 2;
        }

        .machine {
            flex: 1;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 14px 10px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 10px 30px rgba(0, 0, 0, 0.45);
        }

        .machine-title {
            font-size: 14px;
            color: #ffd86b;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .drum-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 160px;
        }

        .drum {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 25%, rgba(255,255,255,0.14), transparent 35%),
                radial-gradient(circle at 65% 85%, rgba(0,0,0,0.6), transparent 45%),
                linear-gradient(145deg, #1f2a44 0%, #07090f 100%);
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                inset 0 0 25px rgba(0, 0, 0, 0.8),
                0 0 0 6px rgba(255, 215, 0, 0.08),
                0 12px 24px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .drum::before {
            content: "";
            position: absolute;
            inset: 10%;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            animation: spinLine 8s linear infinite;
        }

        @keyframes spinLine {
            to { transform: rotate(360deg); }
        }

        .ball-track {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        .mini-ball {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            box-shadow:
                inset -3px -3px 6px rgba(0,0,0,0.5),
                inset 2px 2px 4px rgba(255,255,255,0.4),
                0 0 8px rgba(255,255,255,0.15);
        }

        .mini-ball.red-ball {
            background: radial-gradient(circle at 30% 30%, #ff7676, #c0392b);
        }

        .mini-ball.blue-ball {
            background: radial-gradient(circle at 30% 30%, #6aa8ff, #1967d2);
        }

        .drum.rolling .ball-track {
            animation: rotateDrum 0.6s linear infinite;
        }

        @keyframes rotateDrum {
            to { transform: rotate(360deg); }
        }

        .pipe {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 55px;
            background: linear-gradient(180deg, #ffd86b, #ff9500);
            border-radius: 14px;
            z-index: 3;
            box-shadow: 0 4px 10px rgba(255, 149, 0, 0.45);
        }

        .drop-zone {
            position: absolute;
            bottom: -42px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            z-index: 4;
        }

        .drop-ball {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            opacity: 0;
            transform: translateX(-50%) translateY(-20px) scale(0.7);
        }

        .drop-ball.red-ball {
            background: radial-gradient(circle at 30% 30%, #ff7676, #c0392b);
        }

        .drop-ball.blue-ball {
            background: radial-gradient(circle at 30% 30%, #6aa8ff, #1967d2);
        }

        .drop-ball.dropping {
            animation: dropBall 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes dropBall {
            0% {
                opacity: 1;
                transform: translateX(-50%) translateY(-20px) scale(0.7);
            }
            60% {
                opacity: 1;
                transform: translateX(-50%) translateY(10px) scale(1.15);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        .result-board {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 18px;
            z-index: 2;
        }

        .result-title {
            text-align: center;
            font-size: 13px;
            letter-spacing: 3px;
            color: #ffd86b;
            margin-bottom: 12px;
        }

        .result-balls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-height: 54px;
        }

        .result-ball {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            opacity: 0;
            transform: scale(0.4);
            box-shadow:
                inset -4px -4px 8px rgba(0,0,0,0.5),
                inset 3px 3px 6px rgba(255,255,255,0.35),
                0 0 12px rgba(255,255,255,0.15);
        }

        .result-ball.red-ball {
            background: radial-gradient(circle at 30% 30%, #ff7676, #c0392b);
        }

        .result-ball.blue-ball {
            background: radial-gradient(circle at 30% 30%, #6aa8ff, #1967d2);
        }

        .result-ball.show {
            animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .btn {
            width: 100%;
            max-width: 420px;
            padding: 14px;
            border: none;
            border-radius: 999px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(90deg, #ff9500, #ff2d55, #ff9500);
            background-size: 200% 100%;
            box-shadow:
                0 8px 20px rgba(255, 45, 85, 0.45),
                0 0 0 1px rgba(255,255,255,0.08) inset;
            z-index: 2;
            transition: background-position 0.4s;
        }

        .btn:hover {
            background-position: 100% 0;
        }

        .btn:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
        }

        .history-panel {
            width: 100%;
            max-width: 420px;
            margin-top: 24px;
            z-index: 2;
        }

        .history-title {
            font-size: 14px;
            color: #ffd86b;
            letter-spacing: 3px;
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 4px solid #ffd86b;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
        }

        .history-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #b0bed9;
            margin-bottom: 8px;
        }

        .history-balls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .h-ball {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        .h-ball.red-ball {
            background: radial-gradient(circle at 30% 30%, #ff7676, #c0392b);
        }

        .h-ball.blue-ball {
            background: radial-gradient(circle at 30% 30%, #6aa8ff, #1967d2);
        }

        @media (max-width: 360px) {
            .result-ball {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }

            .mini-ball {
                width: 18px;
                height: 18px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="top-tags">
        <div class="tag">前区红球 1-35</div>
        <div class="tag">后区蓝球 1-12</div>
    </div>

    <div class="machine-container">
        <div class="machine">
            <div class="machine-title">前区</div>
            <div class="drum-wrap">
                <div class="drum" id="redDrum">
                    <div class="ball-container" id="redBallContainer"></div>
                </div>
                <div class="pipe"></div>
                <div class="drop-zone">
                    <div class="drop-ball red-ball" id="redDropBall"></div>
                </div>
            </div>
        </div>

        <div class="machine">
            <div class="machine-title">后区</div>
            <div class="drum-wrap">
                <div class="drum" id="blueDrum">
                    <div class="ball-container" id="blueBallContainer"></div>
                </div>
                <div class="pipe"></div>
                <div class="drop-zone">
                    <div class="drop-ball blue-ball" id="blueDropBall"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="result-board">
        <div class="result-title">当前开奖结果（按出球顺序）</div>
        <div class="result-balls" id="resultBalls"></div>
    </div>

    <button class="btn" id="startBtn" onclick="startDraw()">开始摇奖</button>

    <div class="history-panel">
        <div class="history-title">历史开奖记录</div>
        <div class="history-list" id="historyList">
            <div style="text-align:center;color:#777;font-size:13px;padding:16px;">暂无记录，快去摇奖吧</div>
        </div>
    </div>

    <script>
        const pad = n => String(n).padStart(2, "0");

        function cryptoRand(max) {
            const arr = new Uint32Array(1);
            window.crypto.getRandomValues(arr);
            return Math.floor((arr[0] / (0xffffffff + 1)) * max) + 1;
        }

        function pickOne(exist, max) {
            let num;
            do {
                num = cryptoRand(max);
            } while (exist.includes(num));
            return num;
        }

        function createMiniBalls(containerId, maxNum, count, isBlue) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            for (let i = 0; i < count; i++) {
                const ball = document.createElement("div");
                ball.className = "mini-ball " + (isBlue ? "blue-ball" : "red-ball");
                ball.textContent = pad(cryptoRand(maxNum));

                const angle = (360 / count) * i + Math.random() * 25;
                const radius = 28 + Math.random() * 22;
                const size = isBlue ? 18 + Math.random() * 4 : 18 + Math.random() * 4;

                ball.style.width = size + "px";
                ball.style.height = size + "px";
                ball.style.fontSize = Math.max(10, size * 0.55) + "px";
                ball.style.left = "50%";
                ball.style.top = "50%";
                ball.style.transform =
                    "translate(-50%, -50%) rotate(" + angle + "deg) translateY(-" + radius + "px)";

                container.appendChild(ball);
            }
        }

        function initDrums() {
            createMiniBalls("redBallContainer", 35, 12, false);
            createMiniBalls("blueBallContainer", 12, 10, true);
        }

        // ---------- 音频 ----------
        let audioCtx = null;
        let bgmTimer = null;
        let rollOsc = null;
        let rollGain = null;

        function ensureAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        // 好运来风格喜庆民乐 BGM（纯代码合成）
        function startBGM() {
            if (!audioCtx) return;
            stopBGM();

            // 简化版五声音阶旋律：5 3 5 6 1' 6 5 3 2 1 2 3 5 3 2 1
            const melody = [
                783.99, 659.25, 783.99, 880.00,
                1046.50, 880.00, 783.99, 659.25,
                587.33, 523.25, 587.33, 659.25,
                783.99, 659.25, 587.33, 523.25
            ];
            const beats = [
                0.35, 0.35, 0.3, 0.4,
                0.4, 0.3, 0.3, 0.3,
                0.3, 0.3, 0.3, 0.3,
                0.35, 0.3, 0.3, 0.5
            ];

            let step = 0;

            function playNote() {
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = "triangle";
                osc.frequency.value = melody[step % melody.length];

                const beat = beats[step % beats.length];
                gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + beat);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + beat);

                // 低频鼓点
                if (step % 4 === 0) {
                    const drum = audioCtx.createOscillator();
                    const drumGain = audioCtx.createGain();
                    drum.type = "sine";
                    drum.frequency.value = 90;
                    drumGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                    drumGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
                    drum.connect(drumGain);
                    drumGain.connect(audioCtx.destination);
                    drum.start();
                    drum.stop(audioCtx.currentTime + 0.12);
                }

                step++;
            }

            playNote();
            bgmTimer = setInterval(playNote, 340);
        }

        function stopBGM() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        // 滚动隆隆声
        function startRollSound() {
            if (!audioCtx) return;
            stopRollSound();

            rollOsc = audioCtx.createOscillator();
            rollGain = audioCtx.createGain();

            rollOsc.type = "sawtooth";
            rollOsc.frequency.setValueAtTime(70, audioCtx.currentTime);
            rollGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            rollGain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.15);

            rollOsc.connect(rollGain);
            rollGain.connect(audioCtx.destination);
            rollOsc.start();
        }

        function stopRollSound() {
            if (rollOsc) {
                rollOsc.stop();
                rollOsc.disconnect();
                rollOsc = null;
            }
            if (rollGain) {
                rollGain.disconnect();
                rollGain = null;
            }
        }

        function playDropSound(isBlue) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "square";
            osc.frequency.setValueAtTime(isBlue ? 1200 : 1000, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);

            setTimeout(() => {
                if (!audioCtx) return;
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = "sine";
                osc2.frequency.setValueAtTime(isBlue ? 650 : 520, audioCtx.currentTime);
                gain2.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.12);
            }, 60);
        }

        function playFinalSound() {
            if (!audioCtx) return;

            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "triangle";
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + i * 0.15 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.15 + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.15);
                osc.stop(audioCtx.currentTime + i * 0.15 + 0.35);
            });
        }

        // ---------- 历史记录 ----------
        let issueSerial = 1;

        function addHistory(reds, blues) {
            const list = document.getElementById("historyList");

            if (list.querySelector(".empty-tip")) {
                list.innerHTML = "";
            }

            const item = document.createElement("div");
            item.className = "history-item";

            const now = new Date();
            const timeStr =
                (now.getMonth() + 1) + "月" +
                now.getDate() + "日 " +
                pad(now.getHours()) + ":" +
                pad(now.getMinutes()) + ":" +
                pad(now.getSeconds());

            let ballsHtml = "";
            reds.forEach(n => ballsHtml += `<div class="h-ball red-ball">${pad(n)}</div>`);
            blues.forEach(n => ballsHtml += `<div class="h-ball blue-ball">${pad(n)}</div>`);

            item.innerHTML = `
                <div class="history-info">
                    <span>第 ${issueSerial++} 期</span>
                    <span>${timeStr}</span>
                </div>
                <div class="history-balls">${ballsHtml}</div>
            `;

            list.insertBefore(item, list.firstChild);
        }

        // ---------- 摇奖主流程 ----------
        async function startDraw() {
            ensureAudio();

            const btn = document.getElementById("startBtn");
            const redDrum = document.getElementById("redDrum");
            const blueDrum = document.getElementById("blueDrum");
            const resultBalls = document.getElementById("resultBalls");
            const redDropBall = document.getElementById("redDropBall");
            const blueDropBall = document.getElementById("blueDropBall");

            btn.disabled = true;
            btn.textContent = "摇奖中...";
            resultBalls.innerHTML = "";

            initDrums();

            const redResult = [];
            const blueResult = [];

            // 前区
            redDrum.classList.add("rolling");
            startBGM();
            startRollSound();
            await new Promise(r => setTimeout(r, 2200 + cryptoRand(1200)));

            for (let i = 0; i < 5; i++) {
                const next = pickOne(redResult, 35);
                redResult.push(next);

                redDropBall.textContent = pad(next);
                redDropBall.classList.remove("dropping");
                void redDropBall.offsetWidth;
                redDropBall.classList.add("dropping");

                playDropSound(false);

                setTimeout(() => {
                    const ball = document.createElement("div");
                    ball.className = "result-ball red-ball show";
                    ball.textContent = pad(next);
                    resultBalls.appendChild(ball);
                }, 350);

                await new Promise(r => setTimeout(r, 900 + cryptoRand(700)));
            }

            redDrum.classList.remove("rolling");
            await new Promise(r => setTimeout(r, 500 + cryptoRand(400)));

            // 后区
            blueDrum.classList.add("rolling");
            await new Promise(r => setTimeout(r, 1800 + cryptoRand(1000)));

            for (let i = 0; i < 2; i++) {
                const next = pickOne(blueResult, 12);
                blueResult.push(next);

                blueDropBall.textContent = pad(next);
                blueDropBall.classList.remove("dropping");
                void blueDropBall.offsetWidth;
                blueDropBall.classList.add("dropping");

                playDropSound(true);

                setTimeout(() => {
                    const ball = document.createElement("div");
                    ball.className = "result-ball blue-ball show";
                    ball.textContent = pad(next);
                    resultBalls.appendChild(ball);
                }, 350);

                await new Promise(r => setTimeout(r, 900 + cryptoRand(600)));
            }

            blueDrum.classList.remove("rolling");

            stopRollSound();
            stopBGM();
            playFinalSound();

            addHistory(redResult, blueResult);

            btn.disabled = false;
            btn.textContent = "再摇一次";
        }

        // 页面初始化
        initDrums();
    </script>
</body>
</html>
