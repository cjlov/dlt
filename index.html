<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乐透电视直播摇奖</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d111a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 20px;
            padding-bottom: 50px;
            overflow-x: hidden;
        }
        .header { font-size: 1.5em; font-weight: bold; color: #d4af37; margin-bottom: 20px; letter-spacing: 2px;}
        
        .machines-wrapper { 
            display: flex; gap: 20px; width: 100%; max-width: 480px; padding: 0 15px; 
            justify-content: center; align-items: flex-start;
        }
        .machine-box { 
            display: flex; flex-direction: column; align-items: center; flex: 1; 
        }
        .machine-label { font-size: 0.9em; color: #8892b0; margin-bottom: 15px; }
        
        .drum-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            margin-bottom: 50px;
        }
        .drum {
            width: 100%; height: 100%;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.6) 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
            position: absolute; top: 0; left: 0;
            overflow: hidden;
        }
        
        .ball-container {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            display: flex; justify-content: center; align-items: center;
        }
        .rolling .ball-container {
            animation: rotateDrum 0.5s linear infinite;
        }
        @keyframes rotateDrum {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mini-ball {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75em; font-weight: bold; color: #fff;
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
        }
        .mini-ball.blue-b { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        
        .mini-ball:nth-child(1) { top: 10%; left: 20%; }
        .mini-ball:nth-child(2) { top: 20%; right: 15%; }
        .mini-ball:nth-child(3) { bottom: 30%; right: 20%; }
        .mini-ball:nth-child(4) { bottom: 15%; left: 30%; }
        .mini-ball:nth-child(5) { top: 40%; left: 10%; }
        .mini-ball:nth-child(6) { top: 50%; right: 10%; }
        .mini-ball:nth-child(7) { bottom: 40%; left: 15%; }
        .mini-ball:nth-child(8) { top: 15%; left: 50%; transform: translateX(-50%); }
        .mini-ball:nth-child(9) { bottom: 10%; left: 50%; transform: translateX(-50%); }
        .mini-ball:nth-child(10) { top: 35%; left: 35%; }
        .mini-ball:nth-child(11) { top: 55%; right: 35%; }
        .mini-ball:nth-child(12) { top: 5%; right: 40%; }

        .pipe {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 70px;
            background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.4) 100%);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 2;
            pointer-events: none;
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%);
        }

        .output-ball {
            position: absolute;
            bottom: -55px; 
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9em; font-weight: bold;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
            z-index: 3;
            opacity: 0;
        }
        .output-ball.blue-b { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        .output-ball.drop { animation: dropBall 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes dropBall {
            0% { opacity: 1; transform: translateX(-50%) translateY(-30px) scale(0.8); }
            100% { opacity: 1; transform: translateX(-50%) translateY(45px) scale(1); }
        }

        .tray-box { width: 100%; max-width: 480px; margin-top: 20px; padding: 0 15px; z-index: 10;}
        .tray {
            width: 100%; min-height: 60px; background: #000;
            border: 2px solid #2a3a5a; border-radius: 10px;
            display: flex; align-items: center; gap: 10px; padding: 10px 15px;
            position: relative;
        }
        .tray::before { content: '当前开奖结果'; position: absolute; top: -10px; left: 10px; font-size: 0.7em; color: #5c7cfa; background: #0d111a; padding: 0 5px; }
        
        .result-ball {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2em; font-weight: bold;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            opacity: 0; transform: scale(0.5);
        }
        .result-ball.blue-b { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        .result-ball.pop { animation: popIn 0.4s forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }

        .btn {
            margin-top: 30px; padding: 15px 40px; font-size: 1.2em; font-weight: bold;
            color: #fff; background: linear-gradient(180deg, #f5af19, #f12711);
            border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(241, 39, 17, 0.4);
            z-index: 10;
        }
        .btn:disabled { background: #333; color: #666; box-shadow: none; }

        .history-panel {
            width: 100%; max-width: 480px;
            margin-top: 40px;
            padding: 0 15px;
            z-index: 10;
        }
        .history-title {
            font-size: 1.1em;
            color: #d4af37;
            margin-bottom: 15px;
            border-left: 4px solid #d4af37;
            padding-left: 10px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #8892b0;
        }
        .history-balls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .h-ball {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85em; font-weight: bold;
            background: #c0392b;
        }
        .h-ball.blue-b { background: #0984e3; }
    </style>
</head>
<body>

    <div class="header">超级大乐透</div>

    <div class="machines-wrapper">
        <div class="machine-box">
            <div class="machine-label">前区红球</div>
            <div class="drum-wrapper">
                <div class="drum" id="drumRed">
                    <div class="ball-container"></div>
                </div>
                <div class="pipe"></div>
            </div>
        </div>
        <div class="machine-box">
            <div class="machine-label">后区蓝球</div>
            <div class="drum-wrapper">
                <div class="drum" id="drumBlue">
                    <div class="ball-container"></div>
                </div>
                <div class="pipe"></div>
            </div>
        </div>
    </div>

    <div class="tray-box">
        <div class="tray" id="resultTray"></div>
    </div>

    <button class="btn" id="startBtn" onclick="startLiveDraw()">开始直播摇奖</button>

    <div class="history-panel">
        <div class="history-title">历史开奖记录</div>
        <div class="history-list" id="historyList">
            <div style="text-align: center; color: #555; font-size: 0.9em; margin-top: 10px;">暂无记录，快去摇奖吧</div>
        </div>
    </div>

    <script>
        let audioCtx;
        let rollInterval = null; 

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        function playSound(freq, duration, type = 'sine', vol = 0.2) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // 替换为柔和的白噪音模拟“沙沙”晃动声，不再刺耳
        function startRollSound() {
            if (rollInterval) clearInterval(rollInterval);
            rollInterval = setInterval(() => {
                // 随机发出清脆的球碰撞声，类似弹珠在盒子里轻轻碰撞
                const randFreq = 300 + Math.random() * 400;
                playSound(randFreq, 0.08, 'sine', 0.08);
            }, 80); 
        }

        function stopRollSound() {
            if (rollInterval) {
                clearInterval(rollInterval);
                rollInterval = null;
            }
        }

        function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }
        const pad = (n) => n.toString().padStart(2, '0');

        function initDrums() {
            const containers = document.querySelectorAll('.ball-container');
            containers.forEach((container, index) => {
                container.innerHTML = '';
                const isBlue = index === 1;
                const maxNum = isBlue ? 12 : 35;
                const cls = isBlue ? 'mini-ball blue-b' : 'mini-ball';
                for(let i=0; i<12; i++) {
                    let num = pad(Math.floor(Math.random() * maxNum) + 1);
                    container.innerHTML += `<div class="${cls}">${num}</div>`;
                }
            });
        }
        initDrums();

        function getRandomNums(count, max) {
            let nums = [];
            while (nums.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!nums.includes(num)) nums.push(num);
            }
            return nums.sort((a, b) => a - b);
        }

        function addHistoryRecord(reds, blues) {
            const list = document.getElementById('historyList');
            if (list.innerText.includes('暂无记录')) {
                list.innerHTML = '';
            }
            const now = new Date();
            const timeStr = `${now.getMonth()+1}月${now.getDate()}日 ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            const issueNum = `第 ${Math.floor(Math.random() * 9000) + 1000} 期`;

            const item = document.createElement('div');
            item.className = 'history-item';
            
            let ballsHtml = '';
            reds.forEach(num => ballsHtml += `<div class="h-ball">${pad(num)}</div>`);
            blues.forEach(num => ballsHtml += `<div class="h-ball blue-b">${pad(num)}</div>`);

            item.innerHTML = `
                <div class="history-info">
                    <span>${issueNum}</span>
                    <span>${timeStr}</span>
                </div>
                <div class="history-balls">${ballsHtml}</div>
            `;
            list.insertBefore(item, list.firstChild);
        }

        async function startLiveDraw() {
            initAudio();
            if(audioCtx.state === 'suspended') audioCtx.resume();

            const btn = document.getElementById('startBtn');
            const drumRed = document.getElementById('drumRed');
            const drumBlue = document.getElementById('drumBlue');
            const tray = document.getElementById('resultTray');

            btn.disabled = true;
            btn.innerText = "摇奖中...";
            tray.innerHTML = ''; 

            const redNums = getRandomNums(5, 35);
            const blueNums = getRandomNums(2, 12);

            // --- 前区红球 ---
            drumRed.classList.add('rolling'); 
            startRollSound(); 
            await new Promise(r => setTimeout(r, 3000)); 

            for (let i = 0; i < 5; i++) {
                // 替换为“管子滚落”的清脆连击音效：先高音后低音（类似哒-咚）
                playSound(850, 0.1, 'sine', 0.2);
                setTimeout(() => playSound(400, 0.1, 'triangle', 0.2), 100);

                vibrate();
                
                const dropBall = document.createElement('div');
                dropBall.className = 'output-ball drop';
                dropBall.innerText = pad(redNums[i]);
                drumRed.parentElement.appendChild(dropBall);

                setTimeout(() => {
                    dropBall.remove(); 
                    const resultBall = document.createElement('div');
                    resultBall.className = 'result-ball pop';
                    resultBall.innerText = pad(redNums[i]);
                    tray.appendChild(resultBall);
                }, 600);

                await new Promise(r => setTimeout(r, 1200));
            }
            drumRed.classList.remove('rolling');
            stopRollSound(); 

            await new Promise(r => setTimeout(r, 500));

            // --- 后区蓝球 ---
            drumBlue.classList.add('rolling');
            startRollSound(); 
            await new Promise(r => setTimeout(r, 2500));

            for (let i = 0; i < 2; i++) {
                playSound(850, 0.1, 'sine', 0.2);
                setTimeout(() => playSound(400, 0.1, 'triangle', 0.2), 100);

                vibrate();
                
                const dropBall = document.createElement('div');
                dropBall.className = 'output-ball blue-b drop';
                dropBall.innerText = pad(blueNums[i]);
                drumBlue.parentElement.appendChild(dropBall);

                setTimeout(() => {
                    dropBall.remove();
                    const resultBall = document.createElement('div');
                    resultBall.className = 'result-ball blue-b pop';
                    resultBall.innerText = pad(blueNums[i]);
                    tray.appendChild(resultBall);
                }, 600);

                await new Promise(r => setTimeout(r, 1200));
            }
            drumBlue.classList.remove('rolling');
            stopRollSound();

            addHistoryRecord(redNums, blueNums);

            btn.disabled = false;
            btn.innerText = "再摇一次";
            setTimeout(() => playSound(1046.5, 0.5, 'sine'), 100);
            setTimeout(() => playSound(1318.5, 0.8, 'sine'), 200);
        }
    </script>
</body>
</html>
