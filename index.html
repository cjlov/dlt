<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乐透直播摇号</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #141418; /* 高级深空灰 */
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            font-size: 1.5em;
            font-weight: 800;
            letter-spacing: 3px;
            margin: 25px 0;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .machines-wrapper {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            padding: 0 10px;
            max-width: 480px;
        }
        .machine-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .machine-label {
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: 600;
            color: #888;
        }
        
        /* 高透玻璃罩 */
        .drum {
            width: 100%;
            aspect-ratio: 3/4;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50px 50px 10px 10px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 50%, rgba(255,255,255,0.03) 100%);
            box-shadow: 
                inset 0 0 20px rgba(255,255,255,0.05), 
                inset -5px -5px 15px rgba(0,0,0,0.4),
                0 15px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            padding: 15px 10px;
            gap: 6px;
        }
        /* 玻璃反光 */
        .drum::before {
            content: '';
            position: absolute;
            top: 5%; left: 5%;
            width: 25%; height: 90%;
            background: linear-gradient(to right, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        
        /* 机器里的球：大字号、高对比度 */
        .mini-ball {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
            font-weight: 900;
            color: #fff;
            -webkit-text-stroke: 0.5px rgba(0,0,0,0.5);
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.4), inset 2px 2px 4px rgba(255,255,255,0.6);
        }
        .mini-ball.blue-b { 
            background: radial-gradient(circle at 30% 30%, #4da6ff, #005ce6);
        }
        
        /* 模拟真实的重力翻滚 */
        .rolling .mini-ball {
            animation: tumble 0.4s infinite alternate ease-in-out;
        }
        .rolling .mini-ball:nth-child(even) { animation-duration: 0.3s; animation-delay: 0.05s; }
        .rolling .mini-ball:nth-child(3n) { animation-duration: 0.5s; animation-delay: 0.1s; }
        @keyframes tumble {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(120px) rotate(180deg); }
        }

        /* 吐球盘 */
        .tray {
            width: 100%;
            min-height: 46px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 5px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
        }
        
        /* 落下的球 */
        .big-ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            font-weight: 900;
            color: #fff;
            -webkit-text-stroke: 1px rgba(0,0,0,0.4);
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 -2px 5px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(-20px);
        }
        .big-ball.blue-b { 
            background: radial-gradient(circle at 30% 30%, #4da6ff, #005ce6);
        }
        
        .big-ball.pop { animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes dropIn {
            0% { opacity: 0; transform: translateY(-20px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 全屏大图播报 */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }
        #overlay.show { opacity: 1; pointer-events: auto; }
        
        .broadcast-card {
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #overlay.show .broadcast-card { transform: scale(1); }
        
        .b-title { font-size: 1.2em; color: #aaa; margin-bottom: 10px; letter-spacing: 2px;}
        .b-num { font-size: 7em; font-weight: 900; line-height: 1; -webkit-text-stroke: 2px rgba(0,0,0,0.3);}
        .b-num.red { color: #ff3b3b; text-shadow: 0 0 40px rgba(255, 59, 59, 0.6); }
        .b-num.blue { color: #3b8cff; text-shadow: 0 0 40px rgba(59, 140, 255, 0.6); }

        /* 按钮 */
        .btn {
            margin-top: 30px;
            padding: 16px 50px;
            font-size: 1.1em;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(180deg, #ff4d4d 0%, #b30000 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(179, 0, 0, 0.4);
            letter-spacing: 1px;
        }
        .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 5px rgba(179, 0, 0, 0.4); }
        .btn:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">大乐透直播摇奖</div>

    <div class="machines-wrapper">
        <div class="machine-box">
            <div class="machine-label">前区红球</div>
            <div class="drum" id="drumRed"></div>
            <div class="tray" id="trayRed"></div>
        </div>
        
        <div class="machine-box">
            <div class="machine-label">后区蓝球</div>
            <div class="drum" id="drumBlue"></div>
            <div class="tray" id="trayBlue"></div>
        </div>
    </div>

    <button class="btn" id="startBtn" onclick="startLiveDraw()">开启直播摇号</button>

    <div id="overlay">
        <div class="broadcast-card">
            <div class="b-title" id="bTitle">第 1 个号码</div>
            <div class="b-num" id="bNum">00</div>
        </div>
    </div>

    <script>
        let audioCtx;
        let bgmOsc = null; // 背景音乐振荡器
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        // 通用音效播放
        function playSound(freq, duration, type = 'sine', vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // 模拟开奖节目的紧张BGM（低频电子节拍）
        function startBGM() {
            if (!audioCtx || bgmInterval) return;
            bgmInterval = setInterval(() => {
                playSound(150, 0.1, 'triangle', 0.15); // 低音鼓点
                playSound(300, 0.05, 'square', 0.05);  // 轻微滴答声
            }, 200); // 200ms 一次，类似心跳节奏
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function vibrate() { if (navigator.vibrate) navigator.vibrate(80); }
        const pad = (n) => n.toString().padStart(2, '0');

        // 填充机器里的球（带清晰数字）
        function initDrums() {
            const drumRed = document.getElementById('drumRed');
            const drumBlue = document.getElementById('drumBlue');
            drumRed.innerHTML = ''; drumBlue.innerHTML = '';
            
            for(let i=0; i<20; i++) {
                let num = pad(Math.floor(Math.random() * 35) + 1);
                drumRed.innerHTML += `<div class="mini-ball">${num}</div>`;
            }
            for(let i=0; i<12; i++) {
                let num = pad(Math.floor(Math.random() * 12) + 1);
                drumBlue.innerHTML += `<div class="mini-ball blue-b">${num}</div>`;
            }
        }
        initDrums();

        function getRandomNums(count, max) {
            let nums = [];
            while (nums.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!nums.includes(num)) nums.push(num);
            }
            return nums.sort((a, b) => a - b);
        }

        async function showOverlay(index, num, isBlue) {
            const overlay = document.getElementById('overlay');
            const bTitle = document.getElementById('bTitle');
            const bNum = document.getElementById('bNum');
            
            bTitle.innerText = isBlue ? `后区第 ${index} 个` : `前区第 ${index} 个`;
            bNum.innerText = pad(num);
            bNum.className = `b-num ${isBlue ? 'blue' : 'red'}`;
            
            overlay.classList.add('show');
            // 吐出号码时的清脆铃声
            playSound(isBlue ? 1200 : 880, 0.4, 'sine', 0.3);
            vibrate();
            
            await new Promise(r => setTimeout(r, 1200));
            overlay.classList.remove('show');
            await new Promise(r => setTimeout(r, 150));
        }

        async function startLiveDraw() {
            initAudio();
            // 部分手机浏览器需要用户交互后才允许播放声音，此时唤醒
            if(audioCtx.state === 'suspended') { audioCtx.resume(); }

            const btn = document.getElementById('startBtn');
            const drumRed = document.getElementById('drumRed');
            const drumBlue = document.getElementById('drumBlue');
            const trayRed = document.getElementById('trayRed');
            const trayBlue = document.getElementById('trayBlue');

            btn.disabled = true;
            btn.innerText = "正在直播摇号...";
            trayRed.innerHTML = '';
            trayBlue.innerHTML = '';

            const redNums = getRandomNums(5, 35);
            const blueNums = getRandomNums(2, 12);

            // --- 红球阶段 ---
            startBGM(); // 开启紧张背景音
            drumRed.classList.add('rolling'); 
            await new Promise(r => setTimeout(r, 2500)); 

            for (let i = 0; i < 5; i++) {
                playSound(400, 0.1, 'square', 0.2); // 吐球机械声
                
                const ballEl = document.createElement('div');
                ballEl.className = 'big-ball pop';
                ballEl.innerText = pad(redNums[i]);
                trayRed.appendChild(ballEl);
                
                await showOverlay(i + 1, redNums[i], false);
            }
            drumRed.classList.remove('rolling');

            await new Promise(r => setTimeout(r, 300));

            // --- 蓝球阶段 ---
            drumBlue.classList.add('rolling');
            await new Promise(r => setTimeout(r, 1500));

            for (let i = 0; i < 2; i++) {
                playSound(500, 0.1, 'square', 0.2);
                
                const ballEl = document.createElement('div');
                ballEl.className = 'big-ball blue-b pop';
                ballEl.innerText = pad(blueNums[i]);
                trayBlue.appendChild(ballEl);
                
                await showOverlay(i + 1, blueNums[i], true);
            }
            drumBlue.classList.remove('rolling');

            // --- 结束 ---
            stopBGM(); // 关闭背景音
            btn.disabled = false;
            btn.innerText = "再摇一次";
            
            // 播放欢呼/礼花音效（快速的高低音阶）
            setTimeout(() => {
                playSound(523.25, 0.2, 'triangle', 0.2); // C5
                setTimeout(() => playSound(659.25, 0.2, 'triangle', 0.2), 150); // E5
                setTimeout(() => playSound(783.99, 0.4, 'triangle', 0.2), 300); // G5
                setTimeout(() => playSound(1046.5, 0.6, 'triangle', 0.3), 450); // C6
            }, 100);
        }
    </script>
</body>
</html>
