<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大乐透模拟摇奖</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#080c18;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px}
.top-bar{width:100%;max-width:420px;display:flex;gap:10px;margin-bottom:14px}
.tag{flex:1;text-align:center;padding:7px;border-radius:99px;border:1px solid rgba(255,215,0,.35);color:#ffd86b;background:rgba(255,255,255,.06);font-size:13px}
.box-row{width:100%;max-width:420px;display:flex;gap:14px;margin-bottom:20px}
.single-box{flex:1;display:flex;flex-direction:column;align-items:center}
.title{color:#ffd86b;margin-bottom:12px;font-size:14px;letter-spacing:3px}
.drum-wrap{width:100%;max-width:160px;aspect-ratio:1/1;position:relative}
.drum{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.14),transparent 35%),#141c30;border:2px solid rgba(255,255,255,.18);overflow:hidden;position:relative}
.ball-layer{position:absolute;inset:0}
.mini-ball{position:absolute;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff;will-change:transform}
.mini-ball.red{background:radial-gradient(circle at 30% 30%,#ff7676,#c0392b)}
.mini-ball.blue{background:radial-gradient(circle at 30% 30%,#6aa8ff,#1967d2)}
.pipe{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:26px;height:55px;background:linear-gradient(180deg,#ffd86b,#ff9500);border-radius:14px;z-index:3}
.drop-zone{position:absolute;bottom:-42px;left:50%;transform:translateX(-50%);width:28px;height:28px;z-index:4}
.drop-ball{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;opacity:0;transform:translate(-50%,-20px);position:absolute;left:50%}
.drop-ball.dropping{animation:drop 0.55s ease-out forwards}
@keyframes drop{0%{opacity:1;transform:translate(-50%,-20px) scale(0.7)}60%{opacity:1;transform:translate(-50%,8px) scale(1.12)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.result{width:100%;max-width:420px;border:1px solid rgba(255,215,0,.25);border-radius:20px;padding:16px;margin-bottom:18px;background:rgba(255,255,255,.04)}
.result-title{text-align:center;color:#ffd86b;margin-bottom:10px;font-size:13px;letter-spacing:2px}
.out-balls{display:flex;justify-content:center;gap:10px;min-height:52px;flex-wrap:wrap}
.out-ball{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold;opacity:0;transform:scale(0.4);animation:pop 0.4s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.btn{width:100%;max-width:420px;padding:14px;border:none;border-radius:99px;font-size:18px;letter-spacing:5px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#ff9500,#ff2d55,#ff9500);background-size:200% 100%;cursor:pointer}
.btn:disabled{background:#444;cursor:default}
.history{width:100%;max-width:420px;margin-top:22px}
.h-title{color:#ffd86b;font-size:14px;border-left:4px solid #ffd86b;padding-left:10px;margin-bottom:10px}
.h-item{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;margin-bottom:8px;background:rgba(255,255,255,.04)}
.h-top{display:flex;justify-content:space-between;font-size:12px;color:#b0bed9;margin-bottom:8px}
.h-row{display:flex;gap:7px;flex-wrap:wrap}
.h-ball{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff}
</style>
</head>
<body>
<div class="top-bar">
  <div class="tag">前区 1‑35</div>
  <div class="tag">后区 1‑12</div>
</div>
<div class="box-row">
  <div class="single-box">
    <div class="title">前区</div>
    <div class="drum-wrap">
      <div class="drum" id="redDrum">
        <div class="ball-layer" id="redLayer"></div>
      </div>
      <div class="pipe"></div>
      <div class="drop-zone"><div class="drop-ball red" id="redDrop"></div></div>
    </div>
  </div>
  <div class="single-box">
    <div class="title">后区</div>
    <div class="drum-wrap">
      <div class="drum" id="blueDrum">
        <div class="ball-layer" id="blueLayer"></div>
      </div>
      <div class="pipe"></div>
      <div class="drop-zone"><div class="drop-ball blue" id="blueDrop"></div></div>
    </div>
  </div>
</div>
<div class="result">
  <div class="result-title">开奖号码</div>
  <div class="out-balls" id="outBox"></div>
</div>
<button class="btn" id="runBtn">开始摇奖</button>
<div class="history">
  <div class="h-title">历史记录</div>
  <div id="histWrap"></div>
</div>

<script>
const pad=n=>String(n).padStart(2,"0");
// 浏览器密码级真随机
const cryptoRand=(max)=>{
  const arr=new Uint32Array(1);
  crypto.getRandomValues(arr);
  return Math.floor(arr[0]/(0xFFFFFFFF+1)*max)+1;
};

// 从数组里面随机抽取一个元素，用于摇奖
const pickRandom=(arr)=>{
  const idx=cryptoRand(arr.length)-1;
  const item=arr[idx];
  arr.splice(idx,1);
  return item;
};

function createBall(layerId,num,isRed){
  const l=document.getElementById(layerId);
  const b=document.createElement("div");
  b.className="mini-ball "+(isRed?"red":"blue");
  b.textContent=pad(num);
  l.appendChild(b);
  return {el:b,x:50+(cryptoRand(36)-18),y:50+(cryptoRand(36)-18),vx:(cryptoRand(12)-6)/10,vy:(cryptoRand(12)-6)/10,num};
}

// 真实惯性滚动，无剧烈抖动
function rollLoop(list){
  let alive=true;
  const f=()=>{
    if(!alive) return;
    for(const b of list){
      // 微小扰动，保留惯性，不会乱飘
      b.vx += (Math.random()-0.5)*0.045;
      b.vy += (Math.random()-0.5)*0.045;
      const s=Math.hypot(b.vx,b.vy);
      if(s>1.25){b.vx=(b.vx/s)*1.25;b.vy=(b.vy/s)*1.25}
      b.x+=b.vx;b.y+=b.vy;
      const edge=12;
      if(b.x<edge){b.x=edge;b.vx=Math.abs(b.vx)*0.93}
      if(b.x>100-edge){b.x=100-edge;b.vx=-Math.abs(b.vx)*0.93}
      if(b.y<edge){b.y=edge;b.vy=Math.abs(b.vy)*0.93}
      if(b.y>100-edge){b.y=100-edge;b.vy=-Math.abs(b.vy)*0.93}
      b.el.style.left=b.x+"%";
      b.el.style.top=b.y+"%";
    }
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
  return ()=>alive=false;
}

let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)}
// 厚重落球音效，贴近真实开奖
function playDropTone(isRed){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(isRed?510:680,audioCtx.currentTime);
  g.gain.setValueAtTime(0.28,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.28);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+0.28);
}

let serial=1;
function saveHis(r,b){
  const w=document.getElementById("histWrap");
  const d=new Date();
  const t=`${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const div=document.createElement("div");
  div.className="h-item";
  div.innerHTML=`<div class="h-top"><span>第${serial++}期</span><span>${t}</span></div><div class="h-row">${[...r,...b].map(x=>`<div class="h-ball ${x<=35?'red':'blue'}">${pad(x)}</div>`).join("")}</div>`;
  w.prepend(div);
}

async function draw(){
  initAudio();
  const btn=document.getElementById("runBtn");
  const out=document.getElementById("outBox");
  const rd=document.getElementById("redDrop");
  const bd=document.getElementById("blueDrop");
  out.innerHTML="";
  btn.disabled=true;btn.textContent="摇奖中…";
  rd.className="drop-ball red";bd.className="drop-ball blue";
  document.getElementById("redLayer").innerHTML="";
  document.getElementById("blueLayer").innerHTML="";

  // 真实规则：红球全部35颗，蓝球全部12颗全部放入滚筒
  const redPool=[];
  for(let i=1;i<=35;i++) redPool.push(createBall("redLayer",i,true));
  const bluePool=[];
  for(let i=1;i<=12;i++) bluePool.push(createBall("blueLayer",i,false));

  const stopR=rollLoop(redPool);
  const stopB=rollLoop(bluePool);

  const resR=[],resB=[];
  // 从筒内现存球随机抽取5个红球
  for(let i=0;i<5;i++){
    const hit=pickRandom(redPool);
    hit.el.style.opacity=0;
    resR.push(hit.num);
    rd.textContent=pad(hit.num);rd.classList.add("dropping");
    playDropTone(true);
    out.innerHTML+=`<div class="out-ball red">${pad(hit.num)}</div>`;
    await new Promise(x=>setTimeout(x,1100+cryptoRand(200)));
    rd.className="drop-ball red";
  }
  // 抽取2个蓝球
  for(let i=0;i<2;i++){
    const hit=pickRandom(bluePool);
    hit.el.style.opacity=0;
    resB.push(hit.num);
    bd.textContent=pad(hit.num);bd.classList.add("dropping");
    playDropTone(false);
    out.innerHTML+=`<div class="out-ball blue">${pad(hit.num)}</div>`;
    await new Promise(x=>setTimeout(x,1100+cryptoRand(200)));
    bd.className="drop-ball blue";
  }
  stopR();stopB();
  document.getElementById("redLayer").innerHTML="";
  document.getElementById("blueLayer").innerHTML="";
  saveHis(resR,resB);
  btn.disabled=false;btn.textContent="开始摇奖";
}
document.getElementById("runBtn").onclick=draw;
</script>
</body>
</html>
