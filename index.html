<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 大乐透自动摇号机</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #1a1a3a 0%, #0d0d1a 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .title {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(90deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 78, 80, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .machine {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
        }
        .ball {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            box-shadow: 0 10px 15px rgba(0,0,0,0.3), inset -5px -5px 15px rgba(0,0,0,0.3), inset 5px 5px 15px rgba(255,255,255,0.4);
            transition: transform 0.1s;
            position: relative;
        }
        .ball.blue {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
        }
        .ball.rolling {
            animation: roll 0.2s infinite;
        }
        @keyframes roll {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
        }
        .btn:active:not(:disabled) {
            transform: translateY(0) scale(0.95);
        }
        .btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="title">🎰 大乐透自动摇号机 🎰</div>

    <div class="machine" id="machine">
        <!-- 前区 5 个红球 -->
        <div class="ball" id="r1">?</div>
        <div class="ball" id="r2">?</div>
        <div class="ball" id="r3">?</div>
        <div class="ball" id="r4">?</div>
        <div class="ball" id="r5">?</div>
        <!-- 后区 2 个蓝球 -->
        <div class="ball blue" id="b1">?</div>
        <div class="ball blue" id="b2">?</div>
    </div>

    <button class="btn" id="startBtn" onclick="startDraw()">开始摇号</button>

    <script>
        const redBalls = ['r1', 'r2', 'r3', 'r4', 'r5'];
        const blueBalls = ['b1', 'b2'];

        // 生成不重复的随机数
        function getRandomNumbers(count, max, exclude = []) {
            let nums = [];
            while (nums.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!nums.includes(num) && !exclude.includes(num)) {
                    nums.push(num);
                }
            }
            return nums.sort((a, b) => a - b);
        }

        // 补零
        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        function startDraw() {
            const btn = document.getElementById('startBtn');
            const allBalls = document.querySelectorAll('.ball');
            
            btn.disabled = true;
            btn.innerText = "摇号中...";
            allBalls.forEach(ball => ball.classList.add('rolling'));

            let ticks = 0;
            const maxTicks = 30;

            // 数字滚动特效
            const interval = setInterval(() => {
                ticks++;
                redBalls.forEach(id => {
                    document.getElementById(id).innerText = pad(Math.floor(Math.random() * 35) + 1);
                });
                blueBalls.forEach(id => {
                    document.getElementById(id).innerText = pad(Math.floor(Math.random() * 12) + 1);
                });

                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    allBalls.forEach(ball => ball.classList.remove('rolling'));

                    const redResult = getRandomNumbers(5, 35);
                    const blueResult = getRandomNumbers(2, 12);

                    redBalls.forEach((id, index) => {
                        document.getElementById(id).innerText = pad(redResult[index]);
                    });
                    blueBalls.forEach((id, index) => {
                        document.getElementById(id).innerText = pad(blueResult[index]);
                    });

                    btn.disabled = false;
                    btn.innerText = "再摇一次";
                }
            }, 50);
        }
    </script>
</body>
</html>
