<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级大乐透‑修复版模拟摇奖</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d111a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 20px;
            padding-bottom: 50px;
            overflow-x: hidden;
        }
        .header { font-size: 1.5em; font-weight: bold; color: #d4af37; margin-bottom: 20px; letter-spacing: 2px;}
        
        .machines-wrapper { 
            display: flex; gap: 20px; width: 100%; max-width: 480px; padding: 0 15px; 
            justify-content: center; align-items: flex-start;
        }
        .machine-box { 
            display: flex; flex-direction: column; align-items: center; flex: 1; 
        }
        .machine-label { font-size: 0.9em; color: #8892b0; margin-bottom: 15px; }
        
        .drum-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            margin-bottom: 50px;
        }
        .drum {
            width: 100%; height: 100%;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.6) 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
            position: absolute; top: 0; left: 0;
            overflow: hidden;
        }
        
        .ball-container {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            display: flex; justify-content: center; align-items: center;
        }
        .rolling .ball-container {
            animation: rotateDrum 0.5s linear infinite;
        }
        @keyframes rotateDrum {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mini-ball {
            width: 22px; height: 22px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7em; font-weight: bold; color: #fff;
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
        }
        .mini-ball.blue-b { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        
        .pipe {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 70px;
            background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.4) 100%);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 2;
            pointer-events: none;
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%);
        }

        .output-ball {
            position: absolute;
            bottom: -55px; 
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9em; font-weight: bold;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
            z-index: 3;
            opacity: 0;
        }
        .output-ball.blue-b { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        .output-ball.drop { animation: dropBall 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes dropBall {
            0% { opacity: 1; transform: translateX(-50%) translateY(-30px) scale(0.8); }
            100% { opacity: 1; transform: translateX(-50%) translateY(45px) scale(1); }
        }

        .tray-box { width: 100%; max-width: 480px; margin-top: 20px; padding: 0 15px; z-index: 10;}
        .tray {
            width: 100%; min-height: 60px; background: #000;
            border: 2px solid #2a3a5a; border-radius: 10px;
            display: flex; align-items: center; gap: 10px; padding: 10px 15px;
            position: relative;
        }
        .tray::before { content: '当前开奖结果（按出球顺序）'; position: absolute; top: -10px; left: 10px; font-size: 0.7em; color: #5c7cfa; background: #0d111a; padding: 0 5px; }
        
        .result-ball {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2em; font-weight: bold;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            opacity: 0; transform: scale(0.5);
        }
        .result-ball.blue-b { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        .result-ball.pop { animation: popIn 0.4s forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }

        .btn {
            margin-top: 30px; padding: 15px 40px; font-size: 1.2em; font-weight: bold;
            color: #fff; background: linear-gradient(180deg, #f5af19, #f12711);
            border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(241, 39, 17, 0.4);
            z-index: 10;
        }
        .btn:disabled { background: #333; color: #666; box-shadow: none; }

        .history-panel {
            width: 100%; max-width: 480px;
            margin-top: 40px;
            padding: 0 15px;
            z-index: 10;
        }
        .history-title {
            font-size: 1.1em;
            color: #d4af37;
            margin-bottom: 15px;
            border-left: 4px solid #d4af37;
            padding-left: 10px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #8892b0;
        }
        .history-balls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .h-ball {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85em; font-weight: bold;
            background: #c0392b;
        }
        .h-ball.blue-b { background: #0984e3; }
    </style>
</head>
<body>

    <div class="header">超级大乐透‑修复版模拟摇奖</div>

    <div class="machines-wrapper">
        <div class="machine-box">
            <div class="machine-label">前区红球（1‑35）</div>
            <div class="drum-wrapper">
                <div class="drum" id="drumRed">
                    <div class="ball-container"></div>
                </div>
                <div class="pipe"></div>
            </div>
        </div>
        <div class="machine-box">
            <div class="machine-label">后区蓝球（1‑12）</div>
            <div class="drum-wrapper">
                <div class="drum" id="drumBlue">
                    <div class="ball-container"></div>
                </div>
                <div class="pipe"></div>
            </div>
        </div>
    </div>

    <div class="tray-box">
        <div class="tray" id="resultTray"></div>
    </div>

    <button class="btn" id="startBtn" onclick="startLiveDraw()">开始直播摇奖</button>

    <div class="history-panel">
        <div class="history-title">历史开奖记录</div>
        <div class="history-list" id="historyList">
            <div style="text-align: center; color: #555; font-size: 0.9em; margin-top: 10px;">暂无记录，快去摇奖吧</div>
        </div>
    </div>

    <script>
        let audioCtx;
        let bgmInterval = null;
        let issueSerial = 1; // 自增期号，不再随机

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        function playSound(freq, duration, type = 'sine', vol = 0.2) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function startBGM() {
            if (bgmInterval) return;
            let step = 0;
            const notes = [
                261.63, 261.63, 329.63, 329.63, 
                392.00, 392.00, 329.63, 329.63, 
            ];
            bgmInterval = setInterval(() => {
                let freq = notes[step % notes.length];
                playSound(freq, 0.1, 'triangle', 0.05); 
                if (step % 4 === 0) {
                    playSound(80, 0.2, 'sine', 0.1);
                }
                step++;
            }, 200);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }
        const pad = (n) => n.toString().padStart(2, '0');

        // ✅ 密码学安全随机数
        function cryptoRand(max){
            const arr = new Uint32Array(1);
            window.crypto.getRandomValues(arr);
            const r = arr[0] / (0xFFFFFFFF + 1);
            return Math.floor(r * max) + 1;
        }

        // ✅ 单次随机抽取一个不重复号码
        function pickOne(exist, max){
            let num;
            do{
                num = cryptoRand(max);
            }while(exist.includes(num));
            return num;
        }

        // ✅ 每次摇奖前重新刷新滚筒内的球
        function initDrums() {
            const containers = document.querySelectorAll('.ball-container');
            containers.forEach((container, index) => {
                container.innerHTML = '';
                const isBlue = index === 1;
                const maxNum = isBlue ? 12 : 35;
                const cls = isBlue ? 'mini-ball blue-b' : 'mini-ball';
                // 随机生成14颗球用于滚筒动画展示
                for(let i=0; i<14; i++) {
                    let num = pad(cryptoRand(maxNum));
                    container.innerHTML += `<div class="${cls}">${num}</div>`;
                }
            });
        }

        function addHistoryRecord(reds, blues) {
            const list = document.getElementById('historyList');
            if (list.innerText.includes('暂无记录')) {
                list.innerHTML = '';
            }
            const now = new Date();
            const timeStr = `${now.getMonth()+1}月${now.getDate()}日 ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            const issueNum = `第 ${issueSerial++} 期`;

            const item = document.createElement('div');
            item.className = 'history-item';
            
            let ballsHtml = '';
            reds.forEach(num => ballsHtml += `<div class="h-ball">${pad(num)}</div>`);
            blues.forEach(num => ballsHtml += `<div class="h-ball blue-b">${pad(num)}</div>`);

            item.innerHTML = `
                <div class="history-info">
                    <span>${issueNum}</span>
                    <span>${timeStr}</span>
                </div>
                <div class="history-balls">${ballsHtml}</div>
            `;
            list.insertBefore(item, list.firstChild);
        }

        async function startLiveDraw() {
            initAudio();
            if(audioCtx.state === 'suspended') audioCtx.resume();

            const btn = document.getElementById('startBtn');
            const drumRed = document.getElementById('drumRed');
            const drumBlue = document.getElementById('drumBlue');
            const tray = document.getElementById('resultTray');

            btn.disabled = true;
            btn.innerText = "摇奖中...";
            tray.innerHTML = ''; 
            initDrums(); // 每次开奖刷新滚筒小球

            let redResult = [];
            let blueResult = [];

            // --- 前区红球，边摇边实时随机出号，不再预先算好 ---
            drumRed.classList.add('rolling'); 
            startBGM(); 
            // 前置摇晃时间随机
            await new Promise(r => setTimeout(r, 2200 + cryptoRand(1200))); 

            for (let i = 0; i < 5; i++) {
                // ✅ 摇到这一刻，才现场随机选出下一颗球
                const nextBall = pickOne(redResult,35);
                redResult.push(nextBall);

                playSound(1046.5, 0.05, 'square', 0.15);
                setTimeout(() => playSound(523.25, 0.1, 'sine', 0.2), 50);
                vibrate();
                
                const dropBall = document.createElement('div');
                dropBall.className = 'output-ball drop';
                dropBall.innerText = pad(nextBall);
                drumRed.parentElement.appendChild(dropBall);

                setTimeout(() => {
                    dropBall.remove(); 
                    const resultBall = document.createElement('div');
                    resultBall.className = 'result-ball pop';
                    resultBall.innerText = pad(nextBall);
                    tray.appendChild(resultBall);
                }, 600);

                // ✅ 每颗球掉落间隔随机，不再固定
                const wait = 900 + cryptoRand(700);
                await new Promise(r => setTimeout(r, wait));
            }
            drumRed.classList.remove('rolling');

            await new Promise(r => setTimeout(r, 400 + cryptoRand(400)));

            // --- 后区蓝球，同样实时随机抽取 ---
            drumBlue.classList.add('rolling');
            await new Promise(r => setTimeout(r, 2000 + cryptoRand(1000)));

            for (let i = 0; i < 2; i++) {
                const nextBall = pickOne(blueResult,12);
                blueResult.push(nextBall);

                playSound(1200, 0.05, 'square', 0.15);
                setTimeout(() => playSound(600, 0.1, 'sine', 0.2), 50);
                vibrate();
                
                const dropBall = document.createElement('div');
                dropBall.className = 'output-ball blue-b drop';
                dropBall.innerText = pad(nextBall);
                drumBlue.parentElement.appendChild(dropBall);

                setTimeout(() => {
                    dropBall.remove();
                    const resultBall = document.createElement('div');
                    resultBall.className = 'result-ball blue-b pop';
                    resultBall.innerText = pad(nextBall);
                    tray.appendChild(resultBall);
                }, 600);

                const wait = 900 + cryptoRand(600);
                await new Promise(r => setTimeout(r, wait));
            }
            drumBlue.classList.remove('rolling');

            stopBGM(); 

            setTimeout(() => playSound(523.25, 0.2, 'sine', 0.2), 100);
            setTimeout(() => playSound(659.25, 0.2, 'sine', 0.2), 300);
            setTimeout(() => playSound(783.99, 0.2, 'sine', 0.2), 500);
            setTimeout(() => playSound(1046.50, 0.5, 'sine', 0.3), 700);

            addHistoryRecord(redResult, blueResult);

            btn.disabled = false;
            btn.innerText = "再摇一次";
        }

        // 页面首次初始化滚筒
        initDrums();
    </script>
</body>
</html>
