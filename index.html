<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大乐透-真实随机摇奖</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 40px;
    background:
        radial-gradient(circle at 20% 10%, rgba(255, 215, 0, 0.18), transparent 26%),
        radial-gradient(circle at 80% 20%, rgba(255, 90, 90, 0.16), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(0, 120, 255, 0.18), transparent 36%),
        linear-gradient(180deg, #05070d 0%, #0c1222 45%, #080c18 100%);
    color: #fff;
    font-family: "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
}

.top-tags {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
}

.tag {
    flex: 1;
    text-align: center;
    padding: 7px 10px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 2px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 215, 0, 0.35);
    color: #ffd86b;
}

/* 两台摇奖机 */
.machine-container {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 14px;
}

.machine {
    flex: 1;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 14px 10px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.machine-title {
    font-size: 14px;
    color: #ffd86b;
    letter-spacing: 4px;
    margin-bottom: 12px;
}

.drum-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    max-width: 160px;
}

.drum {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,0.14), transparent 35%),
        radial-gradient(circle at 65% 85%, rgba(0,0,0,0.6), transparent 45%),
        linear-gradient(145deg, #1f2a44 0%, #07090f 100%);
    border: 2px solid rgba(255, 255, 255, 0.18);
    overflow: hidden;
}

.ball-track {
    position: absolute;
    inset: 0;
    border-radius: 50%;
}

.mini-ball {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.mini-ball.red-ball {
    background: radial-gradient(circle at 30% 30%, #ff7676, #c0392b);
}

.mini-ball.blue-ball {
    background: radial-gradient(circle at 30% 30%, #6aa8ff, #1967d2);
}

/* 透明管道 */
.pipe {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 54px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    z-index: 3;
}

/* 上方收纳筐 */
.collect-board {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 14px;
}

.collect-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: #ffd86b;
    margin-bottom: 10px;
}

.collect-balls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    min-height: 54px;
}

.collect-ball {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    opacity: 0;
    transform: scale(0.4);
}

.collect-ball.red-ball {
    background: radial-gradient(circle at 30% 30%, #ff7676, #c0392b);
}

.collect-ball.blue-ball {
    background: radial-gradient(circle at 30% 30%, #6aa8ff, #1967d2);
}

.collect-ball.show {
    animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes popIn {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* 下方小结果框 → 只一排，前区+后区连在一起 */
.result-board {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 215, 0, 0.25);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 16px;
}

.result-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: #ffd86b;
    margin-bottom: 8px;
}

.result-one-line {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.result-num {
    min-width: 30px;
    height: 30px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    padding: 0 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

.result-num.red-num {
    color: #ff7676;
    border-color: rgba(255, 118, 118, 0.4);
}

.result-num.blue-num {
    color: #6aa8ff;
    border-color: rgba(106, 168, 255, 0.4);
}

.btn {
    width: 100%;
    max-width: 420px;
    padding: 13px;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 5px;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(90deg, #ff9500, #ff2d55, #ff9500);
    background-size: 200% 100%;
    box-shadow: 0 8px 20px rgba(255, 45, 85, 0.45);
}

.btn:disabled {
    background: #444;
    box-shadow: none;
    cursor: not-allowed;
}

.history-panel {
    width: 100%;
    max-width: 420px;
    margin-top: 20px;
}

.history-title {
    font-size: 14px;
    color: #ffd86b;
    letter-spacing: 3px;
    margin-bottom: 10px;
    padding-left: 10px;
    border-left: 4px solid #ffd86b;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-item {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 12px;
}

.history-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #b0bed9;
    margin-bottom: 8px;
}

.history-balls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.h-ball {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
}

.h-ball.red-ball {
    background: radial-gradient(circle at 30% 30%, #ff7676, #c0392b);
}

.h-ball.blue-ball {
    background: radial-gradient(circle at 30% 30%, #6aa8ff, #1967d2);
}
</style>
</head>
<body>

<div class="top-tags">
    <div class="tag">前区红球 1‑35</div>
    <div class="tag">后区蓝球 1‑12</div>
</div>

<div class="machine-container">
    <div class="machine">
        <div class="machine-title">前区</div>
        <div class="drum-wrap">
            <div class="drum" id="redDrum">
                <div class="ball-track" id="redBallContainer"></div>
            </div>
            <div class="pipe"></div>
        </div>
    </div>

    <div class="machine">
        <div class="machine-title">后区</div>
        <div class="drum-wrap">
            <div class="drum" id="blueDrum">
                <div class="ball-track" id="blueBallContainer"></div>
            </div>
            <div class="pipe"></div>
        </div>
    </div>
</div>

<!-- 上方收纳筐 -->
<div class="collect-board">
    <div class="collect-title">收纳筐</div>
    <div class="collect-balls" id="collectBalls"></div>
</div>

<!-- 下方小结果框：单独一排，完整一注 -->
<div class="result-board">
    <div class="result-title">开奖结果</div>
    <div class="result-one-line" id="resultOneLine"></div>
</div>

<button class="btn" id="startBtn" onclick="startDraw()">开始摇奖</button>

<div class="history-panel">
    <div class="history-title">历史开奖记录</div>
    <div class="history-list" id="historyList">
        <div style="text-align:center;color:#777;font-size:13px;padding:16px;">暂无记录，快去摇奖吧</div>
    </div>
</div>

<script>
const pad = n => String(n).padStart(2, "0");

// 核心随机算法保持不变
const cryptoRand = (max) => {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return Math.floor(arr[0] / (0xFFFFFFFF + 1) * max) + 1;
};

const pickRandom = (arr) => {
    const idx = cryptoRand(arr.length) - 1;
    const item = arr[idx];
    arr.splice(idx, 1);
    return item;
};

function createMiniBalls(containerId, maxNum, count, isBlue) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    for (let i = 0; i < count; i++) {
        const ball = document.createElement("div");
        ball.className = "mini-ball " + (isBlue ? "blue-ball" : "red-ball");
        ball.textContent = pad(cryptoRand(maxNum));

        const angle = (360 / count) * i;
        ball.style.left = "50%";
        ball.style.top = "50%";
        ball.style.transform = `rotate(${angle}deg) translateY(-32px)`;

        container.appendChild(ball);
    }
}

function initDrums() {
    createMiniBalls("redBallContainer", 35, 13, false);
    createMiniBalls("blueBallContainer", 12, 9, true);
}

initDrums();

let audioCtx = null;

function ensureAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function playDropSound(isBlue) {
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = isBlue ? 820 : 720;

    gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.11);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
}

let issueSerial = 1;

function addHistory(reds, blues) {
    const list = document.getElementById("historyList");

    if (list.querySelector(".empty-tip")) {
        list.innerHTML = "";
    }

    const item = document.createElement("div");
    item.className = "history-item";

    const now = new Date();
    const timeStr = `${now.getMonth() + 1}月${now.getDate()}日 ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    let html = "";

    [...reds].sort((a, b) => a - b).forEach(n => {
        html += `<div class="h-ball red-ball">${pad(n)}</div>`;
    });

    [...blues].sort((a, b) => a - b).forEach(n => {
        html += `<div class="h-ball blue-ball">${pad(n)}</div>`;
    });

    item.innerHTML = `
        <div class="history-info">
            <span>第 ${issueSerial++} 期</span>
            <span>${timeStr}</span>
        </div>
        <div class="history-balls">${html}</div>
    `;

    list.prepend(item);
}

function runDrumShake(dom, runMs) {
    return new Promise(resolve => {
        const track = dom.querySelector(".ball-track");
        track.style.transition = "none";

        let start = performance.now();

        function tick() {
            const now = performance.now();
            const pass = now - start;

            if (pass >= runMs) {
                track.style.transition = "transform 1.2s cubic-bezier(0.25, 1, 0.5, 1)";
                const currentRot = parseFloat(track.style.transform.replace(/[^0-9\-.]/g, "") || 0);
                track.style.transform = `rotate(${currentRot + 360 * 2}deg)`;
                setTimeout(resolve, 1200);
                return;
            }

            let t = pass / runMs;
            let baseRot = t * 1440;
            let jitter = Math.sin(pass / 60) * (4 + cryptoRand(4));

            track.style.transform = `rotate(${baseRot + jitter}deg)`;

            requestAnimationFrame(tick);
        }

        tick();
    });
}

async function startDraw() {
    ensureAudio();

    const btn = document.getElementById("startBtn");
    const redDrum = document.getElementById("redDrum");
    const blueDrum = document.getElementById("blueDrum");
    const collectBalls = document.getElementById("collectBalls");
    const resultOneLine = document.getElementById("resultOneLine");

    btn.disabled = true;
    btn.textContent = "摇奖中...";

    collectBalls.innerHTML = "";
    resultOneLine.innerHTML = "";

    document.getElementById("redBallContainer").innerHTML = "";
    document.getElementById("blueBallContainer").innerHTML = "";

    await new Promise(r => setTimeout(r, 100));

    initDrums();

    const redResult = [];
    const blueResult = [];

    let redPool = Array.from({ length: 35 }, (_, i) => i + 1);
    let bluePool = Array.from({ length: 12 }, (_, i) => i + 1);

    await runDrumShake(redDrum, 2400 + cryptoRand(1200));

    for (let i = 0; i < 5; i++) {
        const n = pickRandom(redPool);
        redResult.push(n);

        const innerBalls = document.getElementById("redBallContainer").children;
        if (innerBalls.length > 0) {
            const randomBall = innerBalls[cryptoRand(innerBalls.length) - 1];
            randomBall.style.opacity = "0";
            randomBall.style.transform = "scale(0)";
        }

        // 收纳筐红球
        const collectBall = document.createElement("div");
        collectBall.className = "collect-ball red-ball show";
        collectBall.textContent = pad(n);
        collectBalls.appendChild(collectBall);

        // 下方一排：红球先加入
        const num = document.createElement("div");
        num.className = "result-num red-num";
        num.textContent = pad(n);
        resultOneLine.appendChild(num);

        playDropSound(false);
        await new Promise(r => setTimeout(r, 820 + cryptoRand(650)));
    }

    await new Promise(r => setTimeout(r, 420 + cryptoRand(250)));
    await runDrumShake(blueDrum, 1800 + cryptoRand(1000));

    for (let i = 0; i < 2; i++) {
        const n = pickRandom(bluePool);
        blueResult.push(n);

        const innerBalls = document.getElementById("blueBallContainer").children;
        if (innerBalls.length > 0) {
            const randomBall = innerBalls[cryptoRand(innerBalls.length) - 1];
            randomBall.style.opacity = "0";
            randomBall.style.transform = "scale(0)";
        }

        // 收纳筐蓝球
        const collectBall = document.createElement("div");
        collectBall.className = "collect-ball blue-ball show";
        collectBall.textContent = pad(n);
        collectBalls.appendChild(collectBall);

        // 下方同一排，红球之后紧跟着蓝球，完整一注
        const num = document.createElement("div");
        num.className = "result-num blue-num";
        num.textContent = pad(n);
        resultOneLine.appendChild(num);

        playDropSound(true);
        await new Promise(r => setTimeout(r, 780 + cryptoRand(580)));
    }

    addHistory(redResult, blueResult);

    btn.disabled = false;
    btn.textContent = "再摇一次";
}
</script>

</body>
</html>
