<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乐透直播摇号</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 2px;
            margin: 30px 0;
            color: #fff;
            text-transform: uppercase;
        }

        /* 机器区域 */
        .machines-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
            padding: 0 15px;
            max-width: 500px;
        }
        .machine-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .machine-label {
            font-size: 1em;
            margin-bottom: 15px;
            font-weight: 600;
            color: #999;
            letter-spacing: 1px;
        }
        
        /* 玻璃质感滚筒 */
        .drum {
            width: 100%;
            aspect-ratio: 3/4;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 60px 60px 15px 15px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            padding: 15px 10px;
            gap: 6px;
            backdrop-filter: blur(5px);
        }
        
        /* 机器内的小球 */
        .mini-ball {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6em;
            font-weight: bold;
            color: rgba(255,255,255,0.7);
            background: #333;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        
        /* 翻滚动画（重力感） */
        .rolling .mini-ball {
            animation: tumble 0.6s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .rolling .mini-ball:nth-child(even) { animation-duration: 0.45s; animation-delay: 0.1s; }
        .rolling .mini-ball:nth-child(3n) { animation-duration: 0.7s; animation-delay: 0.2s; }
        @keyframes tumble {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(140px) rotate(90deg); }
        }

        /* 吐球槽 */
        .tray {
            width: 100%;
            min-height: 45px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 5px;
        }
        
        /* 吐出的结果球 */
        .big-ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            font-weight: bold;
            color: #fff;
            background: #d32f2f;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 -2px 5px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(-20px);
        }
        .big-ball.blue-b { background: #1976d2; }
        
        /* 平滑落球 */
        .big-ball.pop { animation: dropIn 0.4s ease-out forwards; }
        @keyframes dropIn {
            0% { opacity: 0; transform: translateY(-20px) scale(0.8); }
            70% { transform: translateY(2px) scale(1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 全屏播报 - 玻璃拟态风格 */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        #overlay.show { opacity: 1; pointer-events: auto; }
        
        .broadcast-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.2s;
        }
        #overlay.show .broadcast-card { transform: scale(1); }
        
        .b-title { font-size: 1.2em; color: #999; margin-bottom: 10px; letter-spacing: 2px;}
        .b-num { font-size: 4.5em; font-weight: 800; line-height: 1; }
        .b-num.red { color: #ff5252; text-shadow: 0 0 20px rgba(255, 82, 82, 0.4); }
        .b-num.blue { color: #448aff; text-shadow: 0 0 20px rgba(68, 138, 255, 0.4); }

        /* 按钮 */
        .btn {
            margin-top: 40px;
            padding: 16px 48px;
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .btn:hover:not(:disabled) { background: #444; border-color: #666; }
        .btn:active:not(:disabled) { transform: translateY(1px); }
        .btn:disabled { color: #666; cursor: not-allowed; border-color: #222; }
    </style>
</head>
<body>

    <div class="header">大乐透直播摇奖</div>

    <div class="machines-wrapper">
        <div class="machine-box">
            <div class="machine-label">前区红球</div>
            <div class="drum" id="drumRed"></div>
            <div class="tray" id="trayRed"></div>
        </div>
        
        <div class="machine-box">
            <div class="machine-label">后区蓝球</div>
            <div class="drum" id="drumBlue"></div>
            <div class="tray" id="trayBlue"></div>
        </div>
    </div>

    <button class="btn" id="startBtn" onclick="startLiveDraw()">开始摇号</button>

    <!-- 播报层 -->
    <div id="overlay">
        <div class="broadcast-card">
            <div class="b-title" id="bTitle">第 1 个号码</div>
            <div class="b-num" id="bNum">00</div>
        </div>
    </div>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        // 更柔和的机械音效
        function playSound(freq, duration, type = 'sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        
        function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }
        const pad = (n) => n.toString().padStart(2, '0');

        function initDrums() {
            const drumRed = document.getElementById('drumRed');
            const drumBlue = document.getElementById('drumBlue');
            drumRed.innerHTML = ''; drumBlue.innerHTML = '';
            // 填充暗色小球模拟机器里的球
            for(let i=0; i<20; i++) drumRed.innerHTML += `<div class="mini-ball"></div>`;
            for(let i=0; i<12; i++) drumBlue.innerHTML += `<div class="mini-ball"></div>`;
        }
        initDrums();

        function getRandomNums(count, max) {
            let nums = [];
            while (nums.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!nums.includes(num)) nums.push(num);
            }
            return nums.sort((a, b) => a - b);
        }

        async function showOverlay(index, num, isBlue) {
            const overlay = document.getElementById('overlay');
            const bTitle = document.getElementById('bTitle');
            const bNum = document.getElementById('bNum');
            
            bTitle.innerText = isBlue ? `后区第 ${index} 个` : `前区第 ${index} 个`;
            bNum.innerText = pad(num);
            bNum.className = `b-num ${isBlue ? 'blue' : 'red'}`;
            
            overlay.classList.add('show');
            
            // 播放清脆的定音
            playSound(isBlue ? 1046.5 : 880, 0.3, 'triangle');
            vibrate();
            
            await new Promise(r => setTimeout(r, 1000)); // 播报停留1秒
            overlay.classList.remove('show');
            await new Promise(r => setTimeout(r, 150));
        }

        async function startLiveDraw() {
            initAudio();
            const btn = document.getElementById('startBtn');
            const drumRed = document.getElementById('drumRed');
            const drumBlue = document.getElementById('drumBlue');
            const trayRed = document.getElementById('trayRed');
            const trayBlue = document.getElementById('trayBlue');

            btn.disabled = true;
            btn.innerText = "摇号中...";
            trayRed.innerHTML = '';
            trayBlue.innerHTML = '';

            const redNums = getRandomNums(5, 35);
            const blueNums = getRandomNums(2, 12);

            // --- 红球 ---
            drumRed.classList.add('rolling'); 
            // 滚筒转动的机械噪音感（用低频音模拟）
            playSound(120, 0.2, 'square');
            await new Promise(r => setTimeout(r, 2000)); 

            for (let i = 0; i < 5; i++) {
                // 吐球声
                playSound(300, 0.1, 'square');
                
                const ballEl = document.createElement('div');
                ballEl.className = 'big-ball pop';
                ballEl.innerText = pad(redNums[i]);
                trayRed.appendChild(ballEl);
                
                await showOverlay(i + 1, redNums[i], false);
            }
            drumRed.classList.remove('rolling');

            await new Promise(r => setTimeout(r, 400));

            // --- 蓝球 ---
            drumBlue.classList.add('rolling');
            playSound(120, 0.2, 'square');
            await new Promise(r => setTimeout(r, 1500));

            for (let i = 0; i < 2; i++) {
                playSound(300, 0.1, 'square');
                
                const ballEl = document.createElement('div');
                ballEl.className = 'big-ball blue-b pop';
                ballEl.innerText = pad(blueNums[i]);
                trayBlue.appendChild(ballEl);
                
                await showOverlay(i + 1, blueNums[i], true);
            }
            drumBlue.classList.remove('rolling');

            btn.disabled = false;
            btn.innerText = "再摇一次";
            
            // 结束提示音
            setTimeout(() => playSound(1318.5, 0.5, 'triangle'), 100);
        }
    </script>
</body>
</html>
