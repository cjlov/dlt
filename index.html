<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乐透电视直播摇奖</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d111a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 20px;
        }
        .header { font-size: 1.5em; font-weight: bold; color: #d4af37; margin-bottom: 20px; letter-spacing: 2px;}
        
        .machines-wrapper { display: flex; gap: 15px; width: 100%; max-width: 450px; padding: 0 10px; }
        .machine-box { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .machine-label { font-size: 0.9em; color: #8892b0; margin-bottom: 8px; }
        
        .drum {
            width: 100%; aspect-ratio: 3/4;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 60px 60px 10px 10px;
            background: rgba(255,255,255,0.05);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
            display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center;
            padding: 15px 10px; gap: 6px;
        }
        
        .mini-ball {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8em; font-weight: bold;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.5);
        }
        .mini-ball.blue-b { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        
        .rolling .mini-ball { animation: tumble 0.4s infinite alternate ease-in-out; }
        .rolling .mini-ball:nth-child(even) { animation-duration: 0.3s; }
        @keyframes tumble { 0% { transform: translateY(0); } 100% { transform: translateY(120px); } }

        .tray-box { width: 100%; max-width: 450px; margin-top: 25px; padding: 0 10px; }
        .tray {
            width: 100%; min-height: 60px; background: #000;
            border: 2px solid #2a3a5a; border-radius: 10px;
            display: flex; align-items: center; gap: 10px; padding: 10px 15px;
            position: relative;
        }
        .tray::before { content: '开奖结果'; position: absolute; top: -10px; left: 10px; font-size: 0.7em; color: #5c7cfa; background: #0d111a; padding: 0 5px; }
        
        .big-ball {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2em; font-weight: bold;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
            opacity: 0; transform: scale(0.5);
        }
        .big-ball.blue-b { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
        .big-ball.pop { animation: popIn 0.4s forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }

        .btn {
            margin-top: 30px; padding: 15px 40px; font-size: 1.2em; font-weight: bold;
            color: #fff; background: linear-gradient(180deg, #f5af19, #f12711);
            border: none; border-radius: 30px;
        }
        .btn:disabled { background: #333; color: #666; }
    </style>
</head>
<body>

    <div class="header">超级大乐透</div>

    <div class="machines-wrapper">
        <div class="machine-box">
            <div class="machine-label">前区红球</div>
            <div class="drum" id="drumRed"></div>
        </div>
        <div class="machine-box">
            <div class="machine-label">后区蓝球</div>
            <div class="drum" id="drumBlue"></div>
        </div>
    </div>

    <div class="tray-box">
        <div class="tray" id="resultTray"></div>
    </div>

    <button class="btn" id="startBtn" onclick="startLiveDraw()">开始直播摇奖</button>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playSound(freq, duration, type = 'sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }
        const pad = (n) => n.toString().padStart(2, '0');

        function initDrums() {
            const drumRed = document.getElementById('drumRed');
            const drumBlue = document.getElementById('drumBlue');
            drumRed.innerHTML = ''; drumBlue.innerHTML = '';
            for(let i=0; i<20; i++) drumRed.innerHTML += `<div class="mini-ball">${pad(Math.floor(Math.random()*35)+1)}</div>`;
            for(let i=0; i<12; i++) drumBlue.innerHTML += `<div class="mini-ball blue-b">${pad(Math.floor(Math.random()*12)+1)}</div>`;
        }
        initDrums();

        function getRandomNums(count, max) {
            let nums = [];
            while (nums.length < count) {
                let num = Math.floor(Math.random() * max) + 1;
                if (!nums.includes(num)) nums.push(num);
            }
            return nums.sort((a, b) => a - b);
        }

        async function startLiveDraw() {
            initAudio();
            if(audioCtx.state === 'suspended') audioCtx.resume();

            const btn = document.getElementById('startBtn');
            const drumRed = document.getElementById('drumRed');
            const drumBlue = document.getElementById('drumBlue');
            const tray = document.getElementById('resultTray');

            btn.disabled = true;
            btn.innerText = "摇奖中...";
            tray.innerHTML = ''; 

            const redNums = getRandomNums(5, 35);
            const blueNums = getRandomNums(2, 12);

            drumRed.classList.add('rolling'); 
            await new Promise(r => setTimeout(r, 2000)); 

            for (let i = 0; i < 5; i++) {
                playSound(300, 0.1, 'square');
                vibrate();
                const ballEl = document.createElement('div');
                ballEl.className = 'big-ball pop';
                ballEl.innerText = pad(redNums[i]);
                tray.appendChild(ballEl);
                await new Promise(r => setTimeout(r, 800));
            }
            drumRed.classList.remove('rolling');

            drumBlue.classList.add('rolling');
            await new Promise(r => setTimeout(r, 1000));

            for (let i = 0; i < 2; i++) {
                playSound(400, 0.1, 'square');
                vibrate();
                const ballEl = document.createElement('div');
                ballEl.className = 'big-ball blue-b pop';
                ballEl.innerText = pad(blueNums[i]);
                tray.appendChild(ballEl);
                await new Promise(r => setTimeout(r, 800));
            }
            drumBlue.classList.remove('rolling');

            btn.disabled = false;
            btn.innerText = "再摇一次";
            setTimeout(() => playSound(1046.5, 0.4, 'sine'), 100);
        }
    </script>
</body>
</html>
